<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Structured Vibe Code — the agent is the engine, the developer holds the wheel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#10b981" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <!-- steering wheel -->
  <g transform="translate(170 160)" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round">
    <circle r="96"/>
    <circle r="22" fill="#34d399" stroke="none"/>
    <path d="M-96 0H-22M22 0H96M0 22V96"/>
    <path d="M-68 -68 -16 -16M68 -68 16 -16" stroke-width="6" stroke-opacity=".5"/>
  </g>
  <!-- engine pulse -->
  <polyline points="300,200 340,200 356,150 376,250 396,170 412,200 460,200" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="56" font-weight="700" fill="#ecfdf5">Structured Vibe Code</text>
  <text x="522" y="185" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a7f3d0">The agent is the engine. The developer holds the wheel.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6ee7b7">
    <text x="522" y="240">/vibecode init · understand · enable · allow</text>
    <text x="522" y="270" fill-opacity=".7">Claude Code · Codex · Python stdlib only · MIT</text>
  </g>
</svg>
