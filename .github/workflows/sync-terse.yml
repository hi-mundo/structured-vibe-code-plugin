name: Sync terse voice from upstream caveman

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor skills/ultracave/SKILL.md from JuliusBrussee/caveman
        id: sync
        run: |
          python3 scripts/sync_terse.py | tee sync.json
          echo "changed=$(python3 -c 'import json; print(str(json.load(open("sync.json"))["changed"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: Tests must still pass with the new ruleset
        if: steps.sync.outputs.changed == 'true'
        run: python3 -m unittest discover tests
      - name: Commit to main
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=$(grep -o 'Upstream commit: `[0-9a-f]*`' skills/vibecode/references/terse-upstream.md | tr -d '`' | awk '{print $3}')
          git add skills/vibecode/references/terse-upstream.md
          git commit -m "chore(terse): sync ultracave ruleset from JuliusBrussee/caveman@${SHA:0:7}"
          git push
